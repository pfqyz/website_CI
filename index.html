<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банк инициатив граждан</title>
    <style>
        @import url('https://googleapis.com');

        /* Базовые настройки страницы */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAF7F2; /* Свежий Buttercream/Ivory (не слишком желтый) */
            margin: 0;
            padding: 0;
            color: #0F1A2B; /* Deep Navy вместо черного */
        }

        /* 1. СТАРТОВЫЙ БЛОК (Из вашего макета Figma) */
        .welcome-screen {
            height: 100vh; /* Занимает ровно весь экран */
            display: flex;
            align-items: flex-start;
            padding: 10vh 10vw; /* Отступы сверху и слева как на скрине */
            box-sizing: border-box;
        }

        .welcome-screen h1 {
            font-size: 4rem; /* Крупный, уверенный заголовок */
            font-weight: 500;
            line-height: 1.2;
            color: #0F1A2B; /* Deep Navy */
            margin: 0;
            letter-spacing: -0.02em;
        }

        /* Контейнер для основной рабочей зоны (появляется при скролле) */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 100px 40px;
        }

        /* 2. ВКЛАДКИ САЙТА (Язычки папок) */
        .tabs-container {
            display: flex;
            margin-bottom: 0;
            gap: 6px;
            overflow-x: auto;
            padding-left: 10px;
        }

        .tab {
            padding: 14px 28px;
            cursor: pointer;
            background-color: #52677D; /* Dusty Blue для неактивных вкладок */
            border: 1px solid #BDC4D4;
            border-bottom: none;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #FAF7F2; /* Светлый текст на темной вкладке */
            transition: all 0.2s ease;
            position: relative;
            bottom: -1px;
            white-space: nowrap;
        }

        .tab:hover {
            background-color: #435568;
        }

        /* Активная вкладка — сливается с белой панелью контента */
        .tab.active {
            background-color: #ffffff;
            color: #0F1A2B; /* Deep Navy */
            border-color: #BDC4D4;
            padding-bottom: 15px;
            bottom: -1px;
            z-index: 2;
        }

        /* Белая подложка под контент (Папка) */
        .tab-panel {
            display: none;
            background: #ffffff;
            padding: 40px;
            border: 1px solid #BDC4D4;
            border-radius: 16px;
            border-top-left-radius: 0; /* Эффект цельной папки */
            box-shadow: 0 20px 40px rgba(15, 26, 43, 0.04);
            animation: fadeIn 0.3s ease;
        }

        .tab-panel.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 3. ВЫПАДАЮЩИЕ СПИСКИ ПОДТЕМ */
        details {
            background: #BDC4D4; /* Светло-серый/голубой заменен на BDC4D4 */
            margin-bottom: 16px;
            border: 1px solid #BDC4D4;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        summary {
            padding: 18px 24px;
            font-weight: 600;
            font-size: 1rem;
            color: #0F1A2B; /* Deep Navy */
            cursor: pointer;
            outline: none;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        details[open] {
            background: #ffffff;
            border-color: #BDC4D4;
        }

        details[open] summary {
            border-bottom: 1px solid #BDC4D4;
            background: #FAF7F2; /* Buttercream на шапку раскрытой подтемы */
        }

        .requests-list {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-color: #ffffff;
        }

        /* 4. КАРТОЧКА ЗАЯВКИ */
        .request-card {
            background: #ffffff;
            border: 1px solid #BDC4D4;
            border-radius: 14px; /* Закругленные углы по описанию */
            padding: 24px;
            box-shadow: 0 4px 12px rgba(15, 26, 43, 0.02);
            display: grid;
            grid-template-areas:
                "city file"
                "text text"
                "status date";
            grid-template-rows: auto 1fr auto;
            gap: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .request-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(15, 26, 43, 0.06);
        }

        .card-city {
            grid-area: city;
            font-weight: 700;
            color: #1C2E4A; /* Midnight Blue — цвет города */
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .card-file {
            grid-area: file;
            text-align: right;
            align-self: center;
        }
        .card-file a {
            background-color: #1C2E4A;
            color: #FAF7F2;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .card-file a:hover { opacity: 0.9; }

        .card-text {
            grid-area: text;
            color: #0F1A2B; /* Deep Navy для основного текста */
            font-size: 1rem;
            line-height: 1.6;
        }

        /* Статус, время и даты обработки */
        .card-status-block {
            grid-area: status;
            font-size: 0.85rem;
            color: #52677D; /* Dusty Blue для статуса */
            align-self: end;
            line-height: 1.5;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.75rem;
            background-color: #FAF7F2;
            color: #52677D;
            margin-left: 4px;
            border: 1px solid #BDC4D4;
        }

        .card-date-block {
            grid-area: date;
            font-size: 0.85rem;
            color: #52677D; /* Dusty Blue для даты/времени отправки */
            text-align: right;
            align-self: end;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Стартовый полноэкранный блок по макету Figma -->
    <div class="welcome-screen">
        <h1>Банк инициатив<br>граждан</h1>
    </div>

    <!-- Основная рабочая область, которая начинается ниже при прокрутке -->
    <div class="main-content">
        <!-- Сюда JS вставит новые вкладки-язычки -->
        <div class="tabs-container" id="tabs"></div>

        <!-- Сюда JS вставит контент (папки) -->
        <div id="panels"></div>
    </div>
    
    <script>
    async function initSite() {
        try {
            const response = await fetch('data.json');
            const data = await response.json();

            const structuredData = {};

            data.forEach(item => {
                // Универсальный поиск темы (проверяет все варианты)
                const theme = item.theme || item["Тема"] || item.Theme || "Без темы";
                // Универсальный поиск подтемы
                const subtheme = item.subtheme || item["Подтема"] || item.Subtheme || "Общее";

                if (!structuredData[theme]) {
                    structuredData[theme] = {};
                }
                if (!structuredData[theme][subtheme]) {
                    structuredData[theme][subtheme] = [];
                }
                structuredData[theme][subtheme].push(item);
            });

            const tabsContainer = document.getElementById('tabs');
            const panelsContainer = document.getElementById('panels');

            tabsContainer.innerHTML = '';
            panelsContainer.innerHTML = '';

            let isFirst = true;

            for (const theme in structuredData) {
                const themeId = 'theme-' + Math.random().toString(36).substr(2, 9);

                const tab = document.createElement('div');
                tab.className = `tab ${isFirst ? 'active' : ''}`;
                tab.innerText = theme.length > 40 ? theme.substring(0, 40) + '...' : theme;
                tab.title = theme;
                tab.setAttribute('data-target', themeId);
                tabsContainer.appendChild(tab);

                const panel = document.createElement('div');
                panel.className = `tab-panel ${isFirst ? 'active' : ''}`;
                panel.id = themeId;

                for (const subtheme in structuredData[theme]) {
                    const details = document.createElement('details');
                    const summary = document.createElement('summary');
                    summary.innerText = `${subtheme} (${structuredData[theme][subtheme].length})`;
                    details.appendChild(summary);

                    const requestsList = document.createElement('div');
                    requestsList.className = 'requests-list';

                    structuredData[theme][subtheme].forEach(req => {
                        const card = document.createElement('div');
                        card.className = 'request-card';

                        // Ищем города, тексты и даты во всех возможных раскладках
                        const city = req.city || req["Город"] || req.City || "Не указан";
                        const text = req.text || req["Текст"] || req.Text || "Текст отсутствует";
                        const status = req.status || req["Статус_инициативы"] || req.Status || "В обработке";
                        const statusDate = req.status_date || req["Статус_подзадачи"] || req.Status_date || "—";

                        // Защита от пробелов в ключе даты ("Дата " или "Дата")
                        const date = req.date || req["Дата "] || req["Дата"] || req.Date || "—";
                        const time = req.time || req["Время"] || req.Time || "—";
                        const fileUrl = req.file || req["Ссылка на файл"] || req.File || "";

                        let fileHTML = '';
                        if (fileUrl && fileUrl.trim() !== "") {
                            fileHTML = `<div class="card-file"><a href="${fileUrl}" target="_blank">📄 Документ</a></div>`;
                        }

                        card.innerHTML = `
                            <div class="card-city">${city}</div>
                            ${fileHTML}
                            <div class="card-text">${text}</div>
                            <div class="card-status-block">
                                <b>Статус:</b> ${status}<br>
                                <b>Обработано:</b> ${statusDate}
                            </div>
                            <div class="card-date-block">
                                ${date} в ${time}
                            </div>
                        `;
                        requestsList.appendChild(card);
                    });

                    details.appendChild(requestsList);
                    panel.appendChild(details);
                }

                panelsContainer.appendChild(panel);
                isFirst = false;
            }

            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

                    tab.classList.add('active');
                    document.getElementById(tab.getAttribute('data-target')).classList.add('active');
                });
            });

        } catch (error) {
            console.error("Ошибка:", error);
            document.getElementById('panels').innerText = "Ошибка загрузки данных.";
        }
    }

    initSite();
    </script>

</body>
</html>
