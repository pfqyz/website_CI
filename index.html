<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банк инициатив граждан</title>
    <style>
        @import url('https://googleapis.com');

        /* Общий фон страницы — новый мягкий цвет #F9F5ED */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9F5ED;
            margin: 0;
            padding: 0;
            color: #0F1A2B; /* Deep Navy */
            -webkit-text-size-adjust: 100%;
        }

        /* 1. СТАРТОВЫЙ БЛОК (Адаптивный под экраны смартфонов) */
        .welcome-screen {
            height: 30vh;
            display: flex;
            align-items: flex-start;
            padding: 10vh 8vw;
            box-sizing: border-box;
        }

        .welcome-screen h1 {
            font-size: 3.5rem; /* Размер для смартфонов по умолчанию */
            font-weight: 800;
            line-height: 1.15;
            color: #0F1A2B;
            margin: 0;
            letter-spacing: -0.02em;
        }

        /* Настольные мониторы: возвращаем огромный размер заголовка */
        @media (min-width: 768px) {
            .welcome-screen { height: 70vh; padding: 10vh 10vw; }
            .welcome-screen h1 { font-size: 6rem; }
        }

        /* Рабочая область */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 4vw 60px 4vw;
        }
        @media (min-width: 768px) {
            .main-content { padding: 0 10vw 100px 10vw; }
        }

        /* 2. НАСТРОЙКА ВКЛАДОК (Плавный скролл пальцем на мобилках в стиле Pinterest) */
        .tabs-container {
            display: flex;
            flex-wrap: nowrap; /* Запрещаем перенос строк */
            margin-bottom: 24px;
            gap: 6px;
            border-bottom: 4px solid #1C2E4A; /* Четкая синяя полоса */
            padding-bottom: 0;
            overflow-x: auto; /* Включаем горизонтальную прокрутку пальцем */
            overflow-y: hidden; /* Намертво убираем вертикальный ползунок */
            -webkit-overflow-scrolling: touch; /* Делает скролл на iPhone плавным */
        }

        /* Скрываем уродливый стандартный ползунок прокрутки в браузерах */
        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            background-color: #52677D; /* Dusty Blue */
            border: 1px solid #BDC4D4;
            border-bottom: none;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            font-weight: 600;
            font-size: 0.88rem;
            color: #F9F5ED;
            transition: all 0.2s ease;
            white-space: nowrap;
            margin-bottom: -1px;
            flex-shrink: 0; /* Не дает вкладкам сжиматься и ломать текст */
        }
        @media (min-width: 768px) {
            .tab { padding: 14px 24px; font-size: 0.95rem; }
        }

        .tab:hover {
            background-color: #435568;
        }

        /* АКТИВНАЯ ВКЛАДКА */
        .tab.active {
            background-color: #F9F5ED;
            color: #0F1A2B;
            border-color: #1C2E4A;
            border-bottom: 4px solid #F9F5ED;
            margin-bottom: -4px;
            position: relative;
            z-index: 2;
        }

        /* 3. КОНТЕНТНАЯ ПАНЕЛЬ */
        .tab-panel {
            display: none;
            background: transparent !important;
            padding: 0 !important;
            border: none !important;
            box-shadow: none !important;
            animation: fadeIn 0.3s ease;
        }
        .tab-panel.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 4. ПОДТЕМЫ НА ОБЩЕМ ФОНЕ */
        details {
            background: #BDC4D4;
            margin-bottom: 12px;
            border: 1px solid #BDC4D4;
            border-radius: 12px;
            overflow: hidden;
        }

        summary {
            padding: 14px 18px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #0F1A2B;
            cursor: pointer;
            outline: none;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        @media (min-width: 768px) {
            summary { padding: 16px 20px; font-size: 1.05rem; }
        }

        details[open] {
            background: #ffffff;
            border-color: #BDC4D4;
        }

        details[open] summary {
            border-bottom: 1px solid #BDC4D4;
            background: #E6EAEF;
        }

        .requests-list {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        @media (min-width: 768px) {
            .requests-list { padding: 20px; gap: 16px; }
        }

        /* 5. КАРТОЧКА ИНИЦИАТИВЫ (Адаптивная сетка) */
        .request-card {
            background: #ffffff;
            border: 1px solid #BDC4D4;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(15, 26, 43, 0.03);
            display: flex;
            flex-direction: column; /* На мобильных выстраиваем элементы друг под другом */
            gap: 12px;
        }

        /* На компьютерах включаем красивую Grid-сетку */
        @media (min-width: 768px) {
            .request-card {
                padding: 24px;
                display: grid;
                grid-template-areas:
                    "city file"
                    "text text"
                    "status date";
                grid-template-rows: auto 1fr auto;
                gap: 14px;
            }
        }

        .card-city {
            grid-area: city;
            font-weight: 700;
            color: #1C2E4A;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .card-file {
            grid-area: file;
            text-align: left;
        }
        @media (min-width: 768px) {
            .card-file { text-align: right; align-self: center; }
        }
        .card-file a {
            background-color: #1C2E4A;
            color: #F9F5ED;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .card-text {
            grid-area: text;
            color: #0F1A2B;
            font-size: 0.93rem;
            line-height: 1.5;
            word-break: break-word; /* Защита от вылезания длинных слов */
        }
        @media (min-width: 768px) {
            .card-text { font-size: 0.98rem; line-height: 1.6; }
        }

        .card-status-block {
            grid-area: status;
            font-size: 0.8rem;
            color: #52677D;
            line-height: 1.4;
            border-top: 1px solid #E6EAEF; /* Разделитель на мобилках */
            padding-top: 10px;
        }
        @media (min-width: 768px) {
            .card-status-block { font-size: 0.85rem; line-height: 1.5; border-top: none; padding-top: 0; align-self: end; }
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.72rem;
            background-color: #F9F5ED;
            color: #52677D;
            margin-left: 4px;
            border: 1px solid #BDC4D4;
        }

        .card-date-block {
            grid-area: date;
            font-size: 0.8rem;
            color: #52677D;
            text-align: left;
            font-weight: 500;
        }
        @media (min-width: 768px) {
            .card-date-block { font-size: 0.85rem; text-align: right; align-self: end; }
        }
    </style>
</head>
<body>

    <div class="welcome-screen">
        <h1>Банк инициатив<br>граждан</h1>
    </div>

    <div class="main-content">
        <!-- Адаптивный контейнер вкладок с горизонтальным скроллом -->
        <div class="tabs-container" id="tabs"></div>
        <div id="panels"></div>
    </div>

    <script>
    async function initSite() {
        try {
            const response = await fetch('data.json');
            const data = await response.json();

            const structuredData = {};

            data.forEach(item => {
                // Универсальный поиск темы (проверяет все варианты)
                const theme = item.theme || item["Тема"] || item.Theme || "Без темы";
                // Универсальный поиск подтемы
                const subtheme = item.subtheme || item["Подтема"] || item.Subtheme || "Общее";

                if (!structuredData[theme]) {
                    structuredData[theme] = {};
                }
                if (!structuredData[theme][subtheme]) {
                    structuredData[theme][subtheme] = [];
                }
                structuredData[theme][subtheme].push(item);
            });

            const tabsContainer = document.getElementById('tabs');
            const panelsContainer = document.getElementById('panels');

            tabsContainer.innerHTML = '';
            panelsContainer.innerHTML = '';

            let isFirst = true;

            for (const theme in structuredData) {
                const themeId = 'theme-' + Math.random().toString(36).substr(2, 9);

                const tab = document.createElement('div');
                tab.className = `tab ${isFirst ? 'active' : ''}`;
                tab.innerText = theme.length > 40 ? theme.substring(0, 40) + '...' : theme;
                tab.title = theme;
                tab.setAttribute('data-target', themeId);
                tabsContainer.appendChild(tab);

                const panel = document.createElement('div');
                panel.className = `tab-panel ${isFirst ? 'active' : ''}`;
                panel.id = themeId;

                for (const subtheme in structuredData[theme]) {
                    const details = document.createElement('details');
                    const summary = document.createElement('summary');
                    summary.innerText = `${subtheme} (${structuredData[theme][subtheme].length})`;
                    details.appendChild(summary);

                    const requestsList = document.createElement('div');
                    requestsList.className = 'requests-list';

                    structuredData[theme][subtheme].forEach(req => {
                        const card = document.createElement('div');
                        card.className = 'request-card';

                        // Ищем города, тексты и даты во всех возможных раскладках
                        const city = req.city || req["Город"] || req.City || "Не указан";
                        const text = req.text || req["Текст"] || req.Text || "Текст отсутствует";
                        const status = req.status || req["Статус_инициативы"] || req.Status || "В обработке";
                        const statusDate = req.status_date || req["Статус_подзадачи"] || req.Status_date || "—";

                        // Защита от пробелов в ключе даты ("Дата " или "Дата")
                        const date = req.date || req["Дата "] || req["Дата"] || req.Date || "—";
                        const time = req.time || req["Время"] || req.Time || "—";
                        const fileUrl = req.file || req["Ссылка на файл"] || req.File || "";

                        let fileHTML = '';
                        if (fileUrl && fileUrl.trim() !== "") {
                            fileHTML = `<div class="card-file"><a href="${fileUrl}" target="_blank">📄 Документ</a></div>`;
                        }

                        card.innerHTML = `
                            <div class="card-city">${city}</div>
                            ${fileHTML}
                            <div class="card-text">${text}</div>
                            <div class="card-status-block">
                                <b>Статус:</b> ${status}<br>
                                <b>Обработано:</b> ${statusDate}
                            </div>
                            <div class="card-date-block">
                                ${date} в ${time}
                            </div>
                        `;
                        requestsList.appendChild(card);
                    });

                    details.appendChild(requestsList);
                    panel.appendChild(details);
                }

                panelsContainer.appendChild(panel);
                isFirst = false;
            }

            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

                    tab.classList.add('active');
                    document.getElementById(tab.getAttribute('data-target')).classList.add('active');
                });
            });

        } catch (error) {
            console.error("Ошибка:", error);
            document.getElementById('panels').innerText = "Ошибка загрузки данных.";
        }
    }

    initSite();
    </script>

</body>
</html>
