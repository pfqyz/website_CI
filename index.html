<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банк инициатив граждан</title>
    <style>
        @import url('https://googleapis.com');

        /* Общий фон страницы — новый мягкий цвет #F9F5ED */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9F5ED;
            margin: 0;
            padding: 0;
            color: #0F1A2B; /* Deep Navy */
        }

        /* 1. СТАРТОВЫЙ БЛОК */
        .welcome-screen {
            height: 40vh;
            display: flex;
            align-items: flex-start;
            padding: 10vh 10vw;
            box-sizing: border-box;
        }

        .welcome-screen h1 {
            font-size: 6rem;
            font-weight: 800;
            line-height: 1.2;
            color: #0F1A2B;
            margin: 0;
            letter-spacing: -0.02em;
        }

        /* Рабочая область */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 10vw 100px 10vw;
        }

        /* 2. НАСТРОЙКА ВКЛАДОК (Без вертикальных ползунков) */
        .tabs-container {
            display: flex;
            flex-wrap: wrap; /* Вкладки будут переноситься, если не влезают, убирая стрелки вверх-вниз */
            margin-bottom: 30px;
            gap: 8px;
            border-bottom: 4px solid #1C2E4A; /* Четкая синяя полоса под вкладками */
            padding-bottom: 0;
            overflow: hidden; /* Полностью убирает любые ползунки */
        }

        .tab {
            padding: 14px 24px;
            cursor: pointer;
            background-color: #52677D; /* Dusty Blue для неактивных */
            border: 1px solid #BDC4D4;
            border-bottom: none;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #F9F5ED;
            transition: all 0.2s ease;
            white-space: nowrap;
            margin-bottom: -1px;
        }

        .tab:hover {
            background-color: #435568;
        }

        /* АКТИВНАЯ ВКЛАДКА — Идеально сливается с новым фоном #F9F5ED */
        .tab.active {
            background-color: #F9F5ED;
            color: #0F1A2B;
            border-color: #1C2E4A;
            border-bottom: 4px solid #F9F5ED; /* Перекрывает синюю полоску в месте клика */
            margin-bottom: -4px; /* Корректировка под толщину линии */
            position: relative;
            z-index: 2;
        }

        /* 3. КОНТЕНТНАЯ ПАНЕЛЬ (Полностью прозрачная, без рамок и теней) */
        .tab-panel {
            display: none;
            background: transparent !important;
            padding: 0 !important;
            border: none !important;
            box-shadow: none !important;
            animation: fadeIn 0.3s ease;
        }

        .tab-panel.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 4. ПОДТЕМЫ НА ОБЩЕМ ФОНЕ */
        details {
            background: #BDC4D4; /* Светло-серый/голубой */
            margin-bottom: 14px;
            border: 1px solid #BDC4D4;
            border-radius: 12px;
            overflow: hidden;
        }

        summary {
            padding: 16px 20px;
            font-weight: 600;
            font-size: 1.05rem;
            color: #0F1A2B;
            cursor: pointer;
            outline: none;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        details[open] {
            background: #ffffff;
            border-color: #BDC4D4;
        }

        details[open] summary {
            border-bottom: 1px solid #BDC4D4;
            background: #E6EAEF;
        }

        .requests-list {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 5. КАРТОЧКА ИНИЦИАТИВЫ */
        .request-card {
            background: #ffffff;
            border: 1px solid #BDC4D4;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(15, 26, 43, 0.03);
            display: grid;
            grid-template-areas:
                "city file"
                "text text"
                "status date";
            grid-template-rows: auto 1fr auto;
            gap: 14px;
        }

        .card-city {
            grid-area: city;
            font-weight: 700;
            color: #1C2E4A; /* Midnight Blue */
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .card-file {
            grid-area: file;
            text-align: right;
            align-self: center;
        }
        .card-file a {
            background-color: #1C2E4A;
            color: #F9F5ED;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
        }

        .card-text {
            grid-area: text;
            color: #0F1A2B;
            font-size: 0.98rem;
            line-height: 1.6;
        }

        .card-status-block {
            grid-area: status;
            font-size: 0.85rem;
            color: #52677D; /* Dusty Blue */
            align-self: end;
            line-height: 1.5;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.75rem;
            background-color: #F9F5ED;
            color: #52677D;
            margin-left: 4px;
            border: 1px solid #BDC4D4;
        }

        .card-date-block {
            grid-area: date;
            font-size: 0.85rem;
            color: #52677D;
            text-align: right;
            align-self: end;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="welcome-screen">
        <h1>Банк инициатив граждан<br></h1>
    </div>

    <div class="main-content">
        <div class="tabs-container" id="tabs"></div>
        <div id="panels"></div>
    </div>
    <script>
    async function initSite() {
        try {
            const response = await fetch('data.json');
            const data = await response.json();

            const structuredData = {};

            data.forEach(item => {
                // Универсальный поиск темы (проверяет все варианты)
                const theme = item.theme || item["Тема"] || item.Theme || "Без темы";
                // Универсальный поиск подтемы
                const subtheme = item.subtheme || item["Подтема"] || item.Subtheme || "Общее";

                if (!structuredData[theme]) {
                    structuredData[theme] = {};
                }
                if (!structuredData[theme][subtheme]) {
                    structuredData[theme][subtheme] = [];
                }
                structuredData[theme][subtheme].push(item);
            });

            const tabsContainer = document.getElementById('tabs');
            const panelsContainer = document.getElementById('panels');

            tabsContainer.innerHTML = '';
            panelsContainer.innerHTML = '';

            let isFirst = true;

            for (const theme in structuredData) {
                const themeId = 'theme-' + Math.random().toString(36).substr(2, 9);

                const tab = document.createElement('div');
                tab.className = `tab ${isFirst ? 'active' : ''}`;
                tab.innerText = theme.length > 40 ? theme.substring(0, 40) + '...' : theme;
                tab.title = theme;
                tab.setAttribute('data-target', themeId);
                tabsContainer.appendChild(tab);

                const panel = document.createElement('div');
                panel.className = `tab-panel ${isFirst ? 'active' : ''}`;
                panel.id = themeId;

                for (const subtheme in structuredData[theme]) {
                    const details = document.createElement('details');
                    const summary = document.createElement('summary');
                    summary.innerText = `${subtheme} (${structuredData[theme][subtheme].length})`;
                    details.appendChild(summary);

                    const requestsList = document.createElement('div');
                    requestsList.className = 'requests-list';

                    structuredData[theme][subtheme].forEach(req => {
                        const card = document.createElement('div');
                        card.className = 'request-card';

                        // Ищем города, тексты и даты во всех возможных раскладках
                        const city = req.city || req["Город"] || req.City || "Не указан";
                        const text = req.text || req["Текст"] || req.Text || "Текст отсутствует";
                        const status = req.status || req["Статус_инициативы"] || req.Status || "В обработке";
                        const statusDate = req.status_date || req["Статус_подзадачи"] || req.Status_date || "—";

                        // Защита от пробелов в ключе даты ("Дата " или "Дата")
                        const date = req.date || req["Дата "] || req["Дата"] || req.Date || "—";
                        const time = req.time || req["Время"] || req.Time || "—";
                        const fileUrl = req.file || req["Ссылка на файл"] || req.File || "";

                        let fileHTML = '';
                        if (fileUrl && fileUrl.trim() !== "") {
                            fileHTML = `<div class="card-file"><a href="${fileUrl}" target="_blank">📄 Документ</a></div>`;
                        }

                        card.innerHTML = `
                            <div class="card-city">${city}</div>
                            ${fileHTML}
                            <div class="card-text">${text}</div>
                            <div class="card-status-block">
                                <b>Статус:</b> ${status}<br>
                                <b>Обработано:</b> ${statusDate}
                            </div>
                            <div class="card-date-block">
                                ${date} в ${time}
                            </div>
                        `;
                        requestsList.appendChild(card);
                    });

                    details.appendChild(requestsList);
                    panel.appendChild(details);
                }

                panelsContainer.appendChild(panel);
                isFirst = false;
            }

            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

                    tab.classList.add('active');
                    document.getElementById(tab.getAttribute('data-target')).classList.add('active');
                });
            });

        } catch (error) {
            console.error("Ошибка:", error);
            document.getElementById('panels').innerText = "Ошибка загрузки данных.";
        }
    }

    initSite();
    </script>

</body>
</html>
